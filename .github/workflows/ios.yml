name: iOS build & test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test on simulator
        run: scripts/build.sh test
      - name: Build unsigned IPA
        run: scripts/build.sh ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AudioExtractor-build
          path: |
            build/AudioExtractor-unsigned.ipa
            build/*.log
