name: AudioExtractor
options:
  bundleIdPrefix: com.soren
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  AudioCore:
    path: Packages/AudioCore
targets:
  AudioExtractor:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: AudioCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 音频提取
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 用于选择要提取音频的视频
        CFBundleDocumentTypes:
          - CFBundleTypeName: 视频和音频
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soren.audioextractor
        PRODUCT_NAME: AudioExtractor
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  # Engine tests: not hosted by the app, link AudioCore directly.
  AudioExtractorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests/AudioCoreTests
      - path: App/Tests/Fixtures
        buildPhase: resources
    dependencies:
      - package: AudioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soren.audioextractor.tests
        GENERATE_INFOPLIST_FILE: YES

  AudioExtractorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/Tests/UITests
    dependencies:
      - target: AudioExtractor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soren.audioextractor.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AudioExtractor:
    build:
      targets:
        AudioExtractor: all
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [AudioExtractor]
      targets:
        - AudioExtractorTests
        - AudioExtractorUITests
    archive:
      config: Release
